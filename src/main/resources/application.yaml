spring:
  application:
    name: saas-guide-sample-transaction-recovery
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/transaction-recovery;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
